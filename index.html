<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>La Morazaneca | Caja</title>

  <meta name="theme-color" content="#DB2E2B">
  <meta name="background-color" content="#DB2E2B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La Morazaneca">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#DB2E2B}
    body{min-height:100vh;display:grid;place-items:center;color:#fff}
    .shell{text-align:center;padding:28px}
    .logo{width:108px;height:108px;border-radius:28px;display:block;margin:0 auto 18px}
    .title{font-size:24px;font-weight:800;margin:0 0 8px}
    .copy{font-size:14px;opacity:.88;margin:0}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="./icon-192.png" alt="La Morazaneca">
    <h1 class="title">La Morazaneca</h1>
    <p class="copy">Abriendo caja…</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // GitHub solo funciona como launcher/PWA.
    // La caja real debe ejecutarse dentro de Apps Script para que google.script.run funcione.
    setTimeout(() => {
      window.location.replace('https://script.google.com/macros/s/AKfycbwFaZwIWhr5156VWskc9UQDXQRwXLAeBBUTuStjkyA2xg5nYf2fGiLsDkZ9t2V3gAJjYA/exec');
    }, 250);
  </script>
</body>
</html>
